schema: "paperclip/v1"
company:
  brandColor: "#2f6f5e"
  requireBoardApprovalForNewAgents: true
sidebar:
  agents:
    - "product-innovation-director"
    - "data-truth-guard"
    - "voc-intelligence-analyst"
    - "competitive-radar-analyst"
    - "design-strategy-agent"
    - "design-director-agent"
    - "dfm-safety-preflight-agent"
    - "concept-to-market-agent"
    - "demo-producer-agent"
  projects:
    - "labebe-ai-design-studio"
agents:
  product-innovation-director:
    icon: "crown"
    capabilities: "Owns the demo strategy, board-ready narrative, approvals, and issue sequencing."
    adapter:
      type: "process"
      config:
        command: "/usr/bin/env"
        args:
          - "python3"
          - "/vol1/1000/projects/toyresearch/labebe-ai-design-studio/workspace/scripts/paperclip_demo_agent.py"
        cwd: "/vol1/1000/projects/toyresearch/labebe-ai-design-studio/workspace"
        timeoutSec: 60
        env:
          LABEBE_AGENT_SLUG: "product-innovation-director"
  data-truth-guard:
    icon: "shield"
    capabilities: "Separates verified facts from demo samples and blocks unsupported claims."
    adapter:
      type: "process"
      config:
        command: "/usr/bin/env"
        args:
          - "python3"
          - "/vol1/1000/projects/toyresearch/labebe-ai-design-studio/workspace/scripts/paperclip_demo_agent.py"
        cwd: "/vol1/1000/projects/toyresearch/labebe-ai-design-studio/workspace"
        timeoutSec: 60
        env:
          LABEBE_AGENT_SLUG: "data-truth-guard"
          LABEBE_TARGET_ISSUE_IDENTIFIER: "LAB-SMOKE-001"
          LABEBE_SMOKE_RUN_TOKEN: "20260426-p0p1-final"
  voc-intelligence-analyst:
    icon: "message-square"
    capabilities: "Clusters review signals into design requirements without inventing source evidence."
