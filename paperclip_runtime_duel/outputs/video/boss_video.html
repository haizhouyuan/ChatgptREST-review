<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Labebe Paperclip Boss Demo Video</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17201b;
      --muted: #5f6a62;
      --paper: #fbfbf7;
      --panel: #ffffff;
      --line: #d8dfd8;
      --green: #245c42;
      --blue: #2f5f8f;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--paper);
      letter-spacing: 0;
    }

    header {
      min-height: 34dvh;
      display: grid;
      align-content: center;
      gap: 16px;
      padding: clamp(28px, 6vw, 72px);
      border-bottom: 1px solid var(--line);
      background: #f4f6ee;
    }

    .eyebrow {
      margin: 0;
      color: var(--green);
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(36px, 7vw, 78px);
      line-height: 1.02;
      letter-spacing: 0;
    }

    .lead {
      margin: 0;
      max-width: 820px;
      color: var(--muted);
      font-size: clamp(17px, 2vw, 22px);
      line-height: 1.5;
    }

    main {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 56px;
    }

    .video-frame {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #000;
      box-shadow: 0 20px 60px rgba(23, 32, 27, 0.14);
    }

    video {
      width: 100%;
      display: block;
      aspect-ratio: 16 / 9;
      background: #000;
    }

    .actions,
    .grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 16px;
    }

    a {
      color: var(--blue);
    }

    .button {
      min-height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 9px 13px;
      border: 1px solid var(--green);
      border-radius: 8px;
      background: var(--green);
      color: #fff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 850;
    }

    .button.secondary {
      background: #fff;
      color: var(--green);
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-top: 24px;
    }

    .card {
      min-width: 0;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }

    .card strong {
      display: block;
      margin-bottom: 8px;
      color: var(--green);
      font-size: 24px;
      line-height: 1;
    }

    .card span {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
    }

    .contact {
      margin-top: 28px;
    }

    .contact img {
      width: 100%;
      display: block;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }

    @media (max-width: 760px) {
      main {
        width: min(100% - 24px, 1180px);
      }

      .actions {
        display: grid;
      }

      .cards {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
</head>
<body>
  <header>
    <p class="eyebrow">Paperclip Runtime Duel / Boss Video</p>
    <h1>老板版结果视频</h1>
    <p class="lead">52 秒，无旁白字幕版。顺序是先结果、再证据、再产品输出、最后下一步，不展示执行流水账。</p>
    <div class="actions">
      <a class="button" href="labebe_paperclip_boss_demo.mp4">直接打开 MP4</a>
      <a class="button secondary" href="../claude_kimi_showcase.html">回到展示总览</a>
      <a class="button secondary" href="../claude_kimi_code_demo_rendered.html">看渲染结果页</a>
    </div>
  </header>

  <main>
    <section class="video-frame">
      <video controls preload="metadata" poster="labebe_paperclip_boss_demo_poster.jpg">
        <source src="labebe_paperclip_boss_demo.mp4" type="video/mp4">
      </video>
    </section>

    <section class="cards" aria-label="video facts">
      <div class="card"><strong>52s</strong><span>8 个结果优先镜头</span></div>
      <div class="card"><strong>1080p</strong><span>1920 × 1080 MP4</span></div>
      <div class="card"><strong>100</strong><span>确定性评分</span></div>
      <div class="card"><strong>0</strong><span>secret scan findings</span></div>
    </section>

    <section class="contact">
      <img src="labebe_paperclip_boss_demo_contact_sheet.jpg" alt="Boss video contact sheet">
    </section>
  </main>
</body>
</html>
