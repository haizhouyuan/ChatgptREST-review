# Runtime profiles for Paperclip Skill Agent.
# Loaded by skill_agent.py and allocator_mvp.py.
# Replaces hardcoded _default_runtimes().

version: 1

runtimes:
  claudekimi:
    provider_id: claudekimi
    model_name: mimo-v2.5-pro
    endpoint: ${CLAUDEKIMI_ENDPOINT:http://127.0.0.1:8080/v1}
    protocol: openai_compatible
    adapter: openai_compatible
    privacy_tier: external_cloud
    quality_tier: critical
    supports_tools: true
    supports_json: true
    max_context_tokens: 128000
    cost_per_mtok_in: 3.0
    cost_per_mtok_out: 15.0
    latency_p50_ms: 3000
    enabled: true
    # Extended capabilities
    supports_streaming: false
    supports_files: false
    supports_shell: false
    supports_web_fetch: false
    supports_mcp: false
    supports_multimodal: false
    # Quota
    quota_mode: opaque_plan
    soft_rpd: 120
    hard_rpd: 180
    soft_rpm: 4
    max_concurrency: 1
    # Health
    health_probe: openai_chat_completion
    health_timeout_ms: 12000
    circuit_open_after_failures: 3
    cooldown_seconds: 600
    # Strengths / weaknesses (for routing hints)
    strengths:
      - high_stakes_reasoning
      - finance_debate
      - risk_veto
      - evidence_synthesis
      - code_reasoning
      - commerce_decision
    weaknesses:
      - endpoint_compatibility_risk

  minimax:
    provider_id: minimax
    model_name: MiniMax-M2.7-highspeed
    endpoint: ${MINIMAX_API_HOST:https://api.minimaxi.com}/v1
    protocol: openai_compatible
    adapter: openai_compatible
    privacy_tier: external_cloud
    quality_tier: standard
    supports_tools: true
    supports_json: true
    max_context_tokens: 128000
    cost_per_mtok_in: 0.5
    cost_per_mtok_out: 2.0
    latency_p50_ms: 1500
    enabled: true
    supports_streaming: false
    supports_files: false
    supports_shell: false
    supports_web_fetch: false
    supports_mcp: false
    supports_multimodal: false
    quota_mode: transparent_or_headerless_api
    soft_rpd: 800
    hard_rpd: 1000
    soft_rpm: 20
    max_concurrency: 4
    health_probe: openai_chat_completion
    health_timeout_ms: 8000
    circuit_open_after_failures: 5
    cooldown_seconds: 300
    strengths:
      - cheap_summary
      - document_draft
      - copy_variant
      - market_technical_report
    weaknesses:
      - financial_roleplay_refusal
      - tool_ordering_risk

  gemini_local:
    provider_id: gemini_local
    model_name: gemini-2.5-pro
    endpoint: gemini-cli
    protocol: gemini_cli
    adapter: gemini_cli
    privacy_tier: external_cloud
    quality_tier: high
    supports_tools: false
    supports_json: true
    max_context_tokens: 1048576
    cost_per_mtok_in: 0.0
    cost_per_mtok_out: 0.0
    latency_p50_ms: 2500
    enabled: true
    supports_streaming: false
    supports_files: true
    supports_shell: true
    supports_web_fetch: true
    supports_mcp: true
    supports_multimodal: true
    quota_mode: opaque_plan
    soft_rpd: 700
    hard_rpd: 950
    soft_rpm: 20
    max_concurrency: 2
    health_probe: cli_auth
    health_timeout_ms: 15000
    circuit_open_after_failures: 3
    cooldown_seconds: 600
    strengths:
      - frontend
      - long_text_synthesis
      - meeting_summary
      - document_draft
      - code_generation
      - boss_gallery_frontend
      - memory_report_writing
      - dtc_copy
    weaknesses:
      - no_paperclip_tool_calling_wrapper
      - opaque_plan_quota
      - structured_json_needs_validator

  ollama_gpu0:
    provider_id: ollama_gpu0
    model_name: qwen2.5:32b
    endpoint: http://localhost:11434/v1
    protocol: openai_compatible
    adapter: openai_compatible
    privacy_tier: local
    quality_tier: standard
    supports_tools: false
    supports_json: true
    max_context_tokens: 32768
    cost_per_mtok_in: 0.0
    cost_per_mtok_out: 0.0
    latency_p50_ms: 5000
    enabled: true
    supports_streaming: true
    supports_files: false
    supports_shell: false
    supports_web_fetch: false
    supports_mcp: false
    supports_multimodal: false
    quota_mode: local_resource
    soft_rpd: 500
    hard_rpd: 500
    soft_rpm: 10
    max_concurrency: 1
    health_probe: openai_chat_completion
    health_timeout_ms: 10000
    circuit_open_after_failures: 2
    cooldown_seconds: 300
    strengths:
      - hr_sensitive_draft
      - local_memory_indexing
      - benchmark
      - private_summary
    weaknesses:
      - tools_disabled
      - slower
      - requires_homepc_online
